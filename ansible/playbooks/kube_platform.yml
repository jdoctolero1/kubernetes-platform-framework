---
# playbooks/kube_platform.yml
- name: Setup Kubernetes Baseline
  hosts: all 
  become: yes
  roles:
    - { role: ../roles/kube_base, tags: [kubenetes_base] }

- name: Setup Kubernetes Control Plane
  hosts: kubernetes_admin[0]
  become: yes
  roles:
    - { role: ../roles/kube_controlplane, tags: [kube_controlplane] }

- name: Install Helm
  hosts: kubernetes_admin 
  become: true
  roles:
    - { role: ../roles/helm_install, tags: [helm_install] }

- name: Install Calico CNI
  hosts: kubernetes_admin[0] 
  become: true
  roles:
    - { role: ../roles/calico_install, tags: [calico_install] }
  when: cni_provider == "calico"

- name: Install Cilium CNI
  hosts: kubernetes_admin[0] 
  become: true
  roles:
    - { role: ../roles/cilium_install, tags: [cilium_install] }
  when: cni_provider == "cilium"

- name: Generate kubeadm join command
  hosts: kubernetes_admin[0]
  become: true
  gather_facts: false
  roles:
    - { role: ../roles/kube_joincmd_build, tags: [kube_joincmd_build] }

- name: Join Kubernetes workers
  hosts: kubernetes_worker 
  become: true
  gather_facts: false
  roles:
    - { role: ../roles/kube_worker_join, tags: [kube_worker_join] }

- name: Install nginx gateway class
  hosts: kubernetes_admin[0] 
  roles:
    - { role: ../roles/ngnix_gateway_install, tags: [ngnix_gateway_install] }