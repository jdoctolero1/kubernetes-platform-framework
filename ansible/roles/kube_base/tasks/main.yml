---
# roles/kube_base/tasks/main.yml
- name: Set hostname
  hostname:
    name: "{{ inventory_hostname }}"

- name: Update apt cache and upgrade packages
  apt:
    update_cache: yes
    upgrade: dist

- name: Install dependencies
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
    state: present

- name: Load kernel modules
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

- name: Apply sysctl for kernel modules
  ansible.builtin.command: sysctl --system
  become: true

- name: Ensure kernel modules are loaded
  ansible.builtin.command: modprobe {{ item }}
  loop:
    - overlay
    - br_netfilter

- name: Configure sysctl for Kubernetes
  copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1

- name: Apply sysctl for network settings
  ansible.builtin.command: sysctl --system
  become: true

- name: Install containerd
  apt:
    name: containerd
    state: present

- name: Configure containerd with systemd cgroups
  shell: |
    mkdir -p /etc/containerd
    containerd config default | tee /etc/containerd/config.toml
    sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: Restart containerd
  service:
    name: containerd
    state: restarted
    enabled: yes

- name: Add Kubernetes APT keyring
  shell: |
    mkdir -p /etc/apt/keyrings
    curl -fsSL {{ apt_keyring_url }} \
    | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Add Kubernetes APT repository
  copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    content: |
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] {{ kubernetes_repo_url }} /

- name: Install kubelet, kubeadm
  apt:
    update_cache: yes
    name:
      - kubelet
      - kubeadm
    state: present

- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
