---
# roles/argocd_install/tasks/main.yml
- name: Install pip3
  apt:
    update_cache: yes
    name:
      - python3-pip
    state: present
  become: yes

- name: Install required Python libraries
  pip:
    name:
      - kubernetes
      - PyYAML
      - jsonpatch
    state: present
  become: yes

- name: Create ArgoCD namespace
  kubernetes.core.k8s:
    name: argocd
    api_version: v1
    kind: Namespace
    state: present
    kubeconfig: /etc/kubernetes/admin.conf

- name: Add ArgoCD Helm repository
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm
    state: present
    kubeconfig: /etc/kubernetes/admin.conf

- name: Install ArgoCD using Helm
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    release_namespace: argocd
    create_namespace: false
    kubeconfig: /etc/kubernetes/admin.conf
    values:
      server:
        service:
          type: "{{ argocd_server_service_type | default('ClusterIP') }}"
      configs:
        secret:
          argocdServerAdminPassword: "{{ argocd_admin_password | default('') }}"
  when: argocd_admin_password is defined or argocd_admin_password != ''

- name: Install ArgoCD using Helm (without password config)
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    release_namespace: argocd
    create_namespace: false
    kubeconfig: /etc/kubernetes/admin.conf
    values:
      server:
        service:
          type: "{{ argocd_server_service_type | default('ClusterIP') }}"
  when: argocd_admin_password is not defined or argocd_admin_password == ''

- name: Wait for ArgoCD API server deployment
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: argocd
    name: argocd-server
    kubeconfig: /etc/kubernetes/admin.conf
  register: argocd_server_deployment
  until: argocd_server_deployment.resources[0].status.replicas == argocd_server_deployment.resources[0].status.readyReplicas | default(0)
  retries: 30
  delay: 10

- name: Display ArgoCD access information
  debug:
    msg: |
      ArgoCD has been installed successfully!
      Namespace: argocd
      Service: argocd-server
      
      To access ArgoCD:
      1. Port forward: kubectl port-forward -n argocd svc/argocd-server 8080:443
      2. Access: https://localhost:8080
      3. Username: admin
      4. Get initial password: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
