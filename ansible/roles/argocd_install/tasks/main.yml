---
# roles/argocd_install/tasks/main.yml
- name: Create ArgoCD namespace
  shell: kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

- name: Add ArgoCD Helm repository
  shell: helm repo add argo https://argoproj.github.io/argo-helm && helm repo update
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

- name: Install ArgoCD using Helm
  shell: |
    helm upgrade --install argocd argo/argo-cd \
      --namespace argocd \
      --set server.service.type={{ argocd_server_service_type | default('ClusterIP') }}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: helm_install_result
  changed_when: "'has been upgraded' in helm_install_result.stdout or 'has been installed' in helm_install_result.stdout"

- name: Wait for ArgoCD API server deployment
  shell: kubectl rollout status deployment/argocd-server -n argocd --timeout=5m
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

- name: Display ArgoCD access information
  debug:
    msg: |
      ArgoCD has been installed successfully!
      Namespace: argocd
      Service: argocd-server
      
      To access ArgoCD:
      1. Port forward: kubectl port-forward -n argocd svc/argocd-server 8080:443
      2. Access: https://localhost:8080
      3. Username: admin
      4. Get initial password: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
