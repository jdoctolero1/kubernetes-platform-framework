---
# roles/calico_install/tasks/main.yml
- name: Download Calico YAML file locally
  ansible.builtin.get_url:
    url: "{{ calico_yaml_url }}"
    dest: "/tmp/calico.yaml"
    mode: '0744'

- name: Set CALICO_IPV4POOL_VXLAN to Always in calico.yaml using yq
  ansible.builtin.command: >
    yq -i '
      (.spec.template.spec.containers[].env[]
        | select(.name == "CALICO_IPV4POOL_VXLAN")
        | .value) = "Always"
    ' /tmp/calico.yaml
    
- name: Set CALICO_IPV4POOL_IPIP to Never in calico.yaml using yq
  ansible.builtin.command: >
    yq -i '
      (.spec.template.spec.containers[].env[]
        | select(.name == "CALICO_IPV4POOL_IPIP")
        | .value) = "Never"
    ' /tmp/calico.yaml

- name: Install Calico CNI
  command: >
    kubectl apply -f /tmp/calico.yaml
  environment:
    KUBECONFIG: "/etc/kubernetes/admin.conf"
  register: calico_result
  until: calico_result.rc == 0
  retries: 5
  delay: 15