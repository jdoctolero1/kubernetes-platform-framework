---
# roles/calico_install/tasks/main.yml
- name: Download Calico YAML file using wget
  ansible.builtin.command: wget -O /tmp/calico.yaml "{{ calico_yaml_url }}"
  args:
    creates: /tmp/calico.yaml

- name: Set CALICO_IPV4POOL_VXLAN to Always in calico.yaml using sed
  ansible.builtin.command: >
    sed -i '/name: CALICO_IPV4POOL_VXLAN/{n;s/value: .*/value: "Always"/;}' /tmp/calico.yaml
    
- name: Set CALICO_IPV4POOL_IPIP to Never in calico.yaml using sed
  ansible.builtin.command: >
    sed -i '/name: CALICO_IPV4POOL_IPIP/{n;s/value: .*/value: "Never"/;}' /tmp/calico.yaml

- name: Install Calico CNI
  command: >
    kubectl apply -f /tmp/calico.yaml
  environment:
    KUBECONFIG: "/etc/kubernetes/admin.conf"
  register: calico_result
  until: calico_result.rc == 0
  retries: 5
  delay: 15