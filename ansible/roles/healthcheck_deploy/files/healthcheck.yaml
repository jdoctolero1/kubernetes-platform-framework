---
apiVersion: v1
kind: Namespace
metadata:
  name: health-check
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: health-check
  name: health-check-deployment
  labels:
    app: health-check
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-check
  template:
    metadata:
      labels:
        app: health-check
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  namespace: health-check
  name: health-check-svc
  labels:
    app: health-check
spec:
  type: NodePort
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 80
    nodePort: 30007
  selector:
    app: health-check